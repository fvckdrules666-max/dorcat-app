<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Dorcat</title>
<meta name="description" content="Dashboard Dormitory & Catering">
<meta name="theme-color" content="#0b1118">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dorcat">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#0b1118;--panel:#121b25;--tx:#e6edf3;--mut:#93a4b3;--cy:#2bb8d6;--gar:rgba(43,184,214,.28)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#pasang{display:none;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--gar);font-size:14px;line-height:1.35}
#pasang.ada{display:flex}
#pasang span{flex:1}
button{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--gar);padding:9px 14px;min-height:40px;cursor:pointer;background:transparent;color:var(--tx);transition:transform .12s ease-out}
button:active{transform:scale(.97)}
button.utama{background:var(--cy);border-color:var(--cy);color:#06202a}
#wadah{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#layar{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);transition:opacity .22s ease-out}
#layar.hilang{opacity:0;pointer-events:none}
#layar img{width:96px;height:96px;border-radius:22px}
#layar h1{margin:0;font-size:20px;font-weight:700}
#pesan{margin:0;color:var(--mut);font-size:15px;line-height:1.5;max-width:320px}
#garis{width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#garis i{display:block;width:40%;height:100%;background:var(--cy);animation:g 1.1s ease-in-out infinite alternate}
@keyframes g{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
#ulang{display:none}
#layar.masalah #ulang{display:inline-block}
#layar.masalah #garis{display:none}
@media (prefers-reduced-motion:reduce){#garis i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="pasang"><span id="pasangTeks"></span><button id="pasangYa" class="utama">Pasang</button><button id="pasangTutup">Nanti</button></div>
<div id="wadah">
  <iframe id="app" title="Dashboard Dormitory & Catering" allow="clipboard-write"></iframe>
  <div id="layar">
    <img src="icon-180.png" alt="">
    <h1>Dashboard Dorcat</h1>
    <div id="garis"><i></i></div>
    <p id="pesan">Membuka dashboard…</p>
    <button id="ulang" class="utama">Coba lagi</button>
  </div>
</div>
<script>
(function () {
  var URL_APP = 'https://script.google.com/macros/s/AKfycbx1_Wi5lwQyel5jayBzGrUbqdA79UbdV63W726alqY7sGUVZ-ulpgP3PZqVRPad78hrkw/exec';
  var BATAS_MS = 30000, TANPA_SINYAL = 'Tidak ada sinyal. Dashboard butuh internet untuk mengambil data terbaru.';
  var $ = function (i) { return document.getElementById(i); };
  var app = $('app'), layar = $('layar'), pesan = $('pesan'), timer = null, dimuat = false;

  function masalah(t) { layar.className = 'masalah'; pesan.textContent = t; }
  function buka() {
    if (!navigator.onLine) { masalah(TANPA_SINYAL); return; }
    dimuat = false; layar.className = ''; pesan.textContent = 'Membuka dashboard…';
    app.src = URL_APP;
    clearTimeout(timer);
    timer = setTimeout(function () { if (!dimuat) masalah('Koneksi lambat. Periksa sinyal, lalu coba lagi.'); }, BATAS_MS);
  }
  app.addEventListener('load', function () {
    if (!app.getAttribute('src')) return;
    dimuat = true; clearTimeout(timer); layar.className = 'hilang';
  });
  $('ulang').addEventListener('click', buka);
  window.addEventListener('online', function () { if (!dimuat) buka(); });
  window.addEventListener('offline', function () { if (!dimuat) masalah(TANPA_SINYAL); });

  // Ajakan pasang: hanya saat dibuka di browser, bukan dari ikon aplikasi
  var mandiri = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ditunda = null, bar = $('pasang'), tolak = false;
  try { tolak = localStorage.getItem('dorcatTutupPasang') === '1'; } catch (e) {}
  var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!mandiri && !tolak && iOS) {
    $('pasangTeks').textContent = 'Pasang di iPhone: buka menu Bagikan di Safari, lalu pilih Tambahkan ke Layar Utama.';
    $('pasangYa').style.display = 'none';
    bar.className = 'ada';
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); ditunda = e;
    if (mandiri || tolak) return;
    $('pasangTeks').textContent = 'Pasang Dashboard Dorcat di HP ini.';
    bar.className = 'ada';
  });
  $('pasangYa').addEventListener('click', function () {
    if (!ditunda) return;
    ditunda.prompt();
    ditunda.userChoice.then(function () { ditunda = null; bar.className = ''; });
  });
  $('pasangTutup').addEventListener('click', function () {
    bar.className = '';
    try { localStorage.setItem('dorcatTutupPasang', '1'); } catch (e) {}
  });
  window.addEventListener('appinstalled', function () { bar.className = ''; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  buka();
})();
</script>
</body>
</html>
